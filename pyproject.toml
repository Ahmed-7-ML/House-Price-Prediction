[project]
name = "house-price-prediction"
version = "1.0.0"
description = "End-to-end MLOps system for California house price prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.21",
    "fastapi>=0.115.0",
    "feast>=0.47.0",
    "ipykernel>=7.3.0",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.14.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
house-price = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
